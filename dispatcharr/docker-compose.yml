services:
  newt:
    image: fosrl/newt:latest
    container_name: newt-dispatcharr
    restart: unless-stopped
    env_file: .env
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    restart: unless-stopped
    volumes:
      - /srv/docker/dispatcharr/config:/data
    labels:
      - pangolin.proxy-resources.dispatcharr.name=Dispatcharr
      - pangolin.proxy-resources.dispatcharr.full-domain=hdhr.beans.is
      - pangolin.proxy-resources.dispatcharr.protocol=http
      - pangolin.proxy-resources.dispatcharr.targets[0].port=9191
      - pangolin.proxy-resources.dispatcharr.targets[0].method=http

  dispatcharr-home:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr-home
    restart: unless-stopped
    volumes:
      - /srv/docker/dispatcharr-home/config:/data
    labels:
      - pangolin.proxy-resources.hdhr-home.name=Dispatcharr Home
      - pangolin.proxy-resources.hdhr-home.full-domain=hdhr-home.beans.is
      - pangolin.proxy-resources.hdhr-home.protocol=http
      - pangolin.proxy-resources.hdhr-home.targets[0].port=9191
      - pangolin.proxy-resources.hdhr-home.targets[0].method=http

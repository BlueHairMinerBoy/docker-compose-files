services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    restart: unless-stopped
    ports:
      - "127.0.0.1:9191:9191"
    volumes:
      - /srv/docker/dispatcharr/config:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9191/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

    
networks:
  default:
    name: proxy
    external: true

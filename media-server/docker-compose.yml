x-common-env: &common-env
  PUID: 995
  PGID: 1001
  TZ: Europe/London

x-common: &common
  restart: unless-stopped

services:
  jellyfin:
    <<: *common
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    volumes:
      - /srv/docker/jellyfin/web-config.json:/jellyfin/jellyfin-web/config.json
      - /srv/docker/jellyfin/config:/config
      - /srv/docker/jellyfin/cache:/cache
      - /mnt/drive/:/drive
    environment:
      JELLYFIN_PublishedServerUrl: https://play.beans.is
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  anubis:
    <<: *common
    image: ghcr.io/techarohq/anubis:latest
    container_name: anubis
    environment:
      BIND: ":8081"
      COOKIE_DOMAIN: ".play.beans.is"
      TARGET: "http://caddy:8082"
      OG_CACHE_CONSIDER_HOST: "true"
      POLICY_FNAME: "/data/cfg/botPolicy.yaml"
    volumes:
      - /srv/docker/anubis/botPolicy.yaml:/data/cfg/botPolicy.yaml

  sabnzbd:
    <<: *common
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      <<: *common-env
    volumes:
      - /srv/docker/sabnzbd/config:/config
      - /mnt/drive/:/drive
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      - /srv/docker/sonarr/config:/config
      - /mnt/drive/:/drive
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      - /srv/docker/radarr/config:/config
      - /mnt/drive/:/drive
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      <<: *common-env
    volumes:
      - /srv/docker/bazarr/config:/config
      - /mnt/drive/:/drive
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6767/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  wizarr:
    <<: *common
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    environment:
      <<: *common-env
    volumes:
      - /srv/docker/wizarr/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5690/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    volumes:
      - /srv/docker/seerr/config:/app/config

  maintainerr:
    <<: *common
    image: ghcr.io/maintainerr/maintainerr:latest
    container_name: maintainerr
    environment:
      <<: *common-env
    volumes:
      - /srv/docker/maintainerr/data:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6246/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: proxy
    external: true
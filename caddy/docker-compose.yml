services:
  caddy:
    build: .
    image: custom-caddy:latest
    container_name: caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: udp
        mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./errors:/var/www/errors:ro
      - /srv/docker/caddy/data:/data
      - /srv/docker/caddy/config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:2019/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: proxy
    external: true

